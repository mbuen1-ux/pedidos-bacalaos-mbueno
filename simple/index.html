<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Pedidos</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#173047;font-family:system-ui,-apple-system,Segoe UI,Arial}.app{max-width:760px;margin:auto;padding:16px 12px 90px}.card{background:#fff;border:1px solid #dfe5ea;border-radius:12px;padding:14px;margin:10px 0}h1,h2{margin:0 0 8px}.muted{color:#6b7785;font-size:12px}.hidden{display:none!important}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5dd;border-radius:9px;background:#fff}button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#123d61;color:#fff}.secondary{background:#e9eef3;color:#173047}.danger{background:#fee4e2;color:#b42318}.results button{display:block;width:100%;text-align:left;margin:5px 0}.article{border:1px solid #e0e5ea;border-radius:10px;padding:10px;margin-top:8px}.habit{border-left:4px solid #155eef}.head{display:grid;grid-template-columns:28px 1fr;gap:7px;align-items:center}.controls{display:grid;grid-template-columns:1.5fr .7fr .7fr;gap:7px;margin:9px 0 0 35px}.controls input,.controls select{padding:9px}.line{border-top:1px solid #edf0f2;padding:11px 0}.line:first-child{border-top:0}.line-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.line-editor{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px 95px;gap:7px;margin-top:8px}.line-editor select,.line-editor input{padding:8px}.line-meta{display:flex;gap:10px;align-items:center;margin-top:7px}.line-actions{display:flex;gap:6px}.line-actions button{padding:7px 10px;font-size:12px}.line-weight{font-weight:700}@media(max-width:560px){.line-editor{grid-template-columns:1fr 95px 65px}.line-editor .line-weight{grid-column:1/-1}}.status{padding:10px;border-radius:9px;background:#ecfdf3;color:#067647;margin-top:10px}.error{background:#fff1f1;color:#b42318}.actions{display:flex;gap:8px}.actions button{flex:1}@media(max-width:560px){.controls{grid-template-columns:1fr 85px 80px}}
</style></head><body><main class="app">
<div id="main"><div class="card"><b>Simple Pedidos</b><div class="muted">Selecciona el cliente para comenzar el pedido.</div></div>
<div id="clientCard" class="card"><b>CLIENTE</b><input id="clientSearch" placeholder="Código o nombre…" autocomplete="off" style="margin-top:8px"><div id="clients" class="results"></div><div id="clientInfo" class="muted"></div></div>
<div id="orderCard" class="card hidden"><b>PEDIDO <span id="count"></span></b><div id="lines"></div><textarea id="obs" placeholder="Observaciones…" style="min-height:65px;margin-top:8px"></textarea><button id="send" class="primary" style="width:100%;margin-top:8px">ENVIAR PEDIDO</button></div>
<div id="catalog" class="card hidden"><div class="actions"><b style="flex:1">ARTÍCULOS DEL CLIENTE</b><button id="addSelected" class="primary">AÑADIR SELECCIONADOS</button></div><div id="habitual"></div><div id="rest"></div></div><div id="status" class="hidden"></div></div>
</main><script>
const U='https://ffgmpwxyzizbfiechlye.supabase.co',K='sb_publishable_nWNT82zrvQ8WTOQ8b6LxRg_HP1D-BtJ';let clients=[],arts=[],fmts=[],formatTypes=[],tars=[],ta=[],cons=[],sel=null,lines=[];
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(t,q='',o={}){let r=await fetch(U+'/rest/v1/'+t+(q?'?'+q:''),{...o,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:o.prefer||'return=representation'}}),s=await r.text(),d=s?JSON.parse(s):[];if(!r.ok)throw Error(d.message||s);return d}
async function load(){try{clients=await api('clientes','select=*&activo=eq.true&order=nombre');arts=await api('articulos','select=*&activo=eq.true&order=referencia');const [formatRows,typeRows]=await Promise.all([api('formatos','select=id,articulo_id,tipo_formato_id,nombre,descripcion,peso_aproximado,cantidad_defecto,unidades_caja,orden,activo&activo=eq.true&order=articulo_id.asc,orden.asc,id.asc'),api('tipos_formato','select=id,codigo,nombre,unidad,activo,orden&activo=eq.true&order=orden.asc,codigo.asc')]);const tm=new Map(typeRows.map(t=>[String(t.id),t]));fmts=formatRows.map(f=>({...f,unidad:String(tm.get(String(f.tipo_formato_id))?.unidad||'')}));formatTypes=typeRows;tars=await api('tarifas','select=*&activa=eq.true');ta=await api('tarifa_articulos','select=*');cons=await api('consumo_cliente','select=*')}catch(e){msg('Error cargando datos: '+e.message,true)}}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function clientResults(q){let a=q?clients.filter(c=>norm(c.codigo+' '+c.nombre).includes(norm(q))).slice(0,20):[];$('clients').innerHTML=a.map(c=>'<button class="secondary" onclick="selectClient(\''+c.id+'\')"><b>'+esc(c.codigo)+'</b> · '+esc(c.nombre)+'</button>').join('')}
function selectClient(id){sel=clients.find(c=>c.id===id);if(!sel)return;$('clientSearch').value=sel.codigo+' · '+sel.nombre;$('clients').innerHTML='';$('clientInfo').textContent='Tarifa: '+(sel.tarifa_codigo||'sin tarifa');lines=[];renderLines();renderCatalog();$('catalog').classList.remove('hidden');$('orderCard').classList.add('hidden')}
function fs(aid){return fmts.filter(f=>String(f.articulo_id)===String(aid))}
function consumption(){let m={};cons.filter(x=>String(x.cliente_id)===String(sel?.id)).forEach(x=>{m[x.articulo_id]=(m[x.articulo_id]||0)+Number(x.kilos_comprados||0)});return m}
function card(a,kg,habit){let f=fs(a.id);let disabled=!f.length;return '<div class="article '+(habit?'habit':'')+'"><div class="head"><input type="checkbox" id="c_'+a.id+'" '+(disabled?'disabled':'')+' onchange="toggle(\''+a.id+'\')"><div><b>'+esc(a.referencia)+' · '+esc(a.nombre)+'</b>'+(habit?'<div class="muted">Consumo: '+kg.toFixed(3)+' kg</div>':'')+(disabled?'<div class="muted">Sin formato configurado</div>':'')+'</div></div>'+(disabled?'':'<div id="ctl_'+a.id+'" class="controls hidden"><select id="f_'+a.id+'" onchange="formatChanged(\''+a.id+'\')">'+f.map((x,i)=>'<option value="'+x.id+'" '+(i?'':'selected')+'>'+esc(x.nombre)+' · '+Number(x.peso_aproximado||0).toFixed(3)+' kg'+(Number(x.unidades_caja)>0?' · '+Number(x.unidades_caja)+' uds./caja':'')+'</option>').join('')+'</select><input id="q_'+a.id+'" type="number" min="'+(String(f[0].unidad||'kg').toLowerCase()==='unidades'?'1':'0')+'" step="'+(String(f[0].unidad||'kg').toLowerCase()==='unidades'?'1':'0.001')+'" value="'+Number(f[0].cantidad_defecto??0)+'" placeholder="Cantidad"><span class="muted" style="align-self:center">'+esc(f[0].unidad||'kg')+'</span><input id="p_'+a.id+'" readonly placeholder="€/kg"></div>')+'</div>'}
function renderCatalog(){let m=consumption(),hab=arts.filter(a=>m[a.id]>0).sort((a,b)=>(m[b.id]||0)-(m[a.id]||0)),rest=arts.filter(a=>!m[a.id]).sort((a,b)=>String(a.referencia).localeCompare(String(b.referencia),undefined,{numeric:true}));$('habitual').innerHTML='<h3>COMPRA HABITUAL</h3>'+(hab.length?hab.map(a=>card(a,m[a.id],true)).join(''):'<div class="muted">No hay consumo registrado.</div>');$('rest').innerHTML='<h3 style="border-top:1px solid #eee;padding-top:14px">RESTO DE ARTÍCULOS</h3>'+rest.map(a=>card(a,0,false)).join('')}
function formatChanged(id){const fsel=$('f_'+id),q=$('q_'+id);const f=fmts.find(x=>String(x.id)===String(fsel?.value));if(!f||!q)return;const unit=String(f.unidad||'kg').toLowerCase();q.value=Number(f.cantidad_defecto??0);q.min=unit==='unidades'?'1':'0';q.step=unit==='unidades'?'1':'0.001';const u=q.nextElementSibling;if(u)u.textContent=f.unidad||'kg';}
function toggle(id){let e=$('ctl_'+id),c=$('c_'+id);e.classList.toggle('hidden',!c.checked);if(c.checked){formatChanged(id);price(id);$('q_'+id).focus()}}
function price(id){let a=arts.find(x=>x.id===id),t=tars.find(x=>x.codigo===sel?.tarifa_codigo),p=ta.find(x=>x.articulo_id===id&&x.tarifa_id===t?.id);$('p_'+id).value=p?.precio_kg??''}
function lineData(a,ff,q){const t=tars.find(x=>x.codigo===sel?.tarifa_codigo),p=Number(ta.find(x=>x.articulo_id===a.id&&x.tarifa_id===t?.id)?.precio_kg||a.precio_base||0),w=Number((q*Number(ff.peso_aproximado||0)).toFixed(3));return {id:crypto.randomUUID(),articulo_id:a.id,formato_id:ff.id,articulo_referencia:a.referencia,articulo_nombre:a.nombre,formato_nombre:ff.nombre,cantidad_solicitada:q,peso_aproximado:w,peso_real:w,precio_kg:p,importe_estimado:Number((w*p).toFixed(2))}}
function addSelected(){let ids=[...document.querySelectorAll('input[id^="c_"]:checked')].map(x=>x.id.slice(2));if(!ids.length)return msg('Selecciona artículos.',true);for(let id of ids){let f=$( 'f_'+id).value,q=Number(String($('q_'+id).value).replace(',','.'));let ff=fmts.find(x=>String(x.id)===String(f));if(!ff)continue;if(!q)q=Number(ff.cantidad_defecto||0);if(q<=0)return msg('Indica una cantidad válida.',true);let a=arts.find(x=>x.id===id);if(!a)continue;lines.push(lineData(a,ff,q));$('c_'+id).checked=false;toggle(id)}renderLines()}
function lineFormatChanged(i,id){const l=lines[i],f=fmts.find(x=>String(x.id)===String(id));if(!l||!f)return;const unit=String(f.unidad||'kg').toLowerCase();l.formato_id=f.id;l.formato_nombre=f.nombre;l.cantidad_solicitada=Number(f.cantidad_defecto||0);if(unit==='unidades')l.cantidad_solicitada=Math.max(1,Math.floor(l.cantidad_solicitada||1));l.peso_aproximado=Number((l.cantidad_solicitada*Number(f.peso_aproximado||0)).toFixed(3));l.peso_real=l.peso_aproximado;renderLines()}
function lineQtyChanged(i,v){const l=lines[i],f=fmts.find(x=>String(x.id)===String(l?.formato_id));if(!l||!f)return;const unit=String(f.unidad||'kg').toLowerCase();let q=Number(String(v).replace(',','.'));if(!Number.isFinite(q)||q<=0)q=Number(f.cantidad_defecto||0);if(unit==='unidades')q=Math.max(1,Math.round(q));else q=Number(q.toFixed(3));l.cantidad_solicitada=q;l.peso_aproximado=Number((q*Number(f.peso_aproximado||0)).toFixed(3));l.peso_real=l.peso_aproximado;renderLines()}
function renderLines(){$('orderCard').classList.toggle('hidden',!lines.length);$('count').textContent=lines.length?'· '+lines.length+' líneas':'';$('lines').innerHTML=lines.map((l,i)=>{const f=fmts.find(x=>String(x.id)===String(l.formato_id))||{},unit=String(f.unidad||'kg').toLowerCase(),step=unit==='unidades'?'1':'0.001',min=unit==='unidades'?'1':'0';return '<div class="line"><div class="line-head"><div><b>'+esc(l.articulo_nombre)+'</b><div class="muted">'+esc(l.articulo_referencia||'')+' · '+esc(f.nombre||l.formato_nombre||'Formato')+'</div></div><div class="line-actions"><button class="danger" onclick="removeLine('+i+')">Quitar</button></div></div><div class="line-editor"><select onchange="lineFormatChanged('+i+',this.value)">'+fs(l.articulo_id).map(x=>'<option value="'+x.id+'" '+(String(x.id)===String(l.formato_id)?'selected':'')+'>'+esc(x.nombre)+' · '+Number(x.peso_aproximado||0).toFixed(3)+' kg</option>').join('')+'</select><input type="number" min="'+min+'" step="'+step+'" value="'+l.cantidad_solicitada+'" onchange="lineQtyChanged('+i+',this.value)" inputmode="'+(unit==='unidades'?'numeric':'decimal')+'"><span class="muted" style="align-self:center">'+esc(f.unidad||'kg')+'</span><span class="line-weight" style="align-self:center">'+Number(l.peso_aproximado||0).toFixed(3)+' kg</span></div></div>'}).join('')}
function removeLine(i){if(i<0||i>=lines.length)return;lines.splice(i,1);renderLines()}
async function send(){if(!sel||!lines.length)return; if(!confirm('¿Enviar pedido?'))return;try{let d=new Date(),date=d.toISOString().slice(0,10),{data:no,error}=await rpc('siguiente_numero_pedido',{p_fecha:date,p_tipo_pedido:'SIMPLE'});if(error)throw error;let total=lines.reduce((s,l)=>s+l.importe_estimado,0),p=await api('pedidos','',{method:'POST',body:JSON.stringify({numero:no,cliente_id:sel.id,fecha:date,hora:d.toTimeString().slice(0,8),estado:'Nuevo',total_estimado:Number(total.toFixed(2)),observaciones:$('obs').value,tipo_pedido:'SIMPLE'})});let pid=p[0]?.id||p.id;await api('pedido_lineas','',{method:'POST',body:JSON.stringify(lines.map(({id,...l})=>({...l,pedido_id:pid,importe_final:l.importe_estimado}))) });alert('✓ PEDIDO ENVIADO\\n\\n'+no);reset()}catch(e){msg('No se pudo guardar: '+e.message,true)}}
async function rpc(fn,args){let r=await fetch(U+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(args)}),s=await r.text(),d=s?JSON.parse(s):null;return r.ok?{data:d,error:null}:{data:null,error:{message:d?.message||s}}}
function reset(){lines=[];sel=null;$('clientSearch').value='';$('clientInfo').textContent='';$('clients').innerHTML='';$('catalog').classList.add('hidden');$('orderCard').classList.add('hidden');$('obs').value='';$('clientSearch').focus()}
function msg(t,e=false){$('status').textContent=t;$('status').className=e?'status error':'status';$('status').classList.remove('hidden');setTimeout(()=>$('status').classList.add('hidden'),5000)}
$('clientSearch').oninput=e=>clientResults(e.target.value);$('addSelected').onclick=addSelected;$('send').onclick=send;load();
</script></body></html>
